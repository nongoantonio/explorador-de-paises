<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fundo circular verde-escuro, a mesma cor do cabeçalho da app -->
  <circle cx="32" cy="32" r="32" fill="#123832" />

  <!-- Corpo do globo -->
  <circle cx="32" cy="32" r="21" fill="#1f5a51" stroke="#c9a227" stroke-width="2" />

  <!-- Paralelo e meridiano únicos, mais grossos, para não ficarem confusos em tamanhos pequenos -->
  <ellipse cx="32" cy="32" rx="21" ry="7" fill="none" stroke="#c9a227" stroke-width="2" opacity="0.6" />
  <line x1="32" y1="11" x2="32" y2="53" stroke="#c9a227" stroke-width="2" opacity="0.5" />

  <!-- Massa de terra estilizada -->
  <path
    d="M24 24c3-4 9-2 10 1 2 4-1 7-5 6-4-1-8 0-5-7z"
    fill="#c9a227"
  />

  <!-- Marcador de mapa (pin), a "assinatura" visual do atlas -->
  <path
    d="M32 40c4 0 7 3 7 7 0 5-7 12-7 12s-7-7-7-12c0-4 3-7 7-7z"
    fill="#c9a227"
  />
  <circle cx="32" cy="47" r="2.6" fill="#123832" />
</svg>
